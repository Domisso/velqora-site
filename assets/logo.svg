<!-- ═══════════════════════════════════════════════════
     VELQORA — Logo SVG
     Zapisz jako /assets/logo.svg
     ═══════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7fff"/>
      <stop offset="100%" stop-color="#7b5fff"/>
    </linearGradient>
  </defs>
  <!-- Icon mark -->
  <rect x="0" y="4" width="40" height="40" rx="10" fill="url(#lg)"/>
  <text x="20" y="30" font-family="Arial Black,sans-serif" font-weight="900" font-size="22" fill="white" text-anchor="middle">V</text>
  <!-- Wordmark -->
  <text x="52" y="33" font-family="Arial Black,sans-serif" font-weight="900" font-size="26" fill="#eef0f6" letter-spacing="-0.5">Velqora</text>
</svg>

<!-- ═══════════════════════════════════════════════════
     IKONA APLIKACJI — zapisz jako /assets/icons/icon.svg
     Używana do generowania ikon w różnych rozmiarach
     ═══════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" style="margin-top:24px;display:block">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f7fff"/>
      <stop offset="100%" stop-color="#7b5fff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="url(#bg-g)"/>
  <!-- Shine overlay -->
  <rect width="512" height="256" rx="114" fill="url(#shine)"/>
  <!-- V letter -->
  <path d="M128 140 L256 372 L384 140" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Accent dot -->
  <circle cx="256" cy="372" r="28" fill="rgba(255,255,255,0.4)"/>
</svg>

<!-- ═══════════════════════════════════════════════════
     FAVICON — zapisz jako /favicon.svg
     ═══════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" style="margin-top:24px;display:block">
  <defs>
    <linearGradient id="fv" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f7fff"/>
      <stop offset="100%" stop-color="#7b5fff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#fv)"/>
  <path d="M8 9 L16 23 L24 9" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
