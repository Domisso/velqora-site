<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Velqora — Strona nie znaleziona</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#05060a;--a:#4f7fff;--a2:#7b5fff;--teal:#2dd4bf;--tx:#eef0f6;--mu:#5a6080;--br:rgba(79,127,255,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none}
.b1{width:600px;height:500px;background:rgba(79,127,255,.07);top:-200px;left:-150px}
.b2{width:400px;height:400px;background:rgba(123,95,255,.06);bottom:-100px;right:-100px}
.wrap{text-align:center;padding:24px;position:relative;z-index:5;max-width:560px}
.code{font-family:'Syne',sans-serif;font-size:clamp(100px,20vw,160px);font-weight:800;line-height:1;background:linear-gradient(135deg,var(--a),var(--a2),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.icon{font-size:64px;margin-bottom:20px;animation:float 4s ease-in-out infinite .5s;display:block}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--tx);margin-bottom:12px;letter-spacing:-.01em}
p{font-size:15px;color:var(--mu);line-height:1.7;margin-bottom:32px;max-width:400px;margin-left:auto;margin-right:auto}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-p{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:13px 28px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;transition:all .2s}
.btn-p:hover{opacity:.9;transform:translateY(-2px)}
.btn-g{border:1px solid var(--br);color:var(--mu);padding:13px 28px;border-radius:10px;font-size:14px;text-decoration:none;transition:all .2s}
.btn-g:hover{border-color:rgba(79,127,255,.4);color:var(--tx)}
.links{display:flex;gap:24px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.links a{font-size:13px;color:var(--mu);text-decoration:none;transition:color .2s}
.links a:hover{color:var(--a)}
.logo{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:40px;text-decoration:none}
.lm{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#fff}
.ln{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:var(--tx)}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="wrap">
  <a class="logo" href="index.html"><div class="lm">V</div><span class="ln">Velqora</span></a>
  <span class="icon">🔍</span>
  <div class="code">404</div>
  <h1>Strona nie istnieje</h1>
  <p>Strona, której szukasz, została przeniesiona lub nigdy nie istniała. Sprawdź adres URL lub wróć do strony głównej.</p>
  <div class="btns">
    <a href="index.html" class="btn-p">← Strona główna</a>
    <a href="javascript:history.back()" class="btn-g">Wróć wstecz</a>
  </div>
  <div class="links">
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html">Logowanie</a>
    <a href="index.html#kontakt">Kontakt</a>
    <a href="api-docs.html">API Docs</a>
  </div>
</div>
</body>
</html>
